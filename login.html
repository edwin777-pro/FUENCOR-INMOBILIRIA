<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fuencor Inmobiliaria - Acceso</title>
    <style>
        /* =========================================
           VARIABLES Y RESET
        ========================================= */
        :root {
            --primary-color: #1A365D; /* Azul oscuro elegante */
            --secondary-color: #D69E2E; /* Dorado */
            --bg-color: #F7FAFC;
            --text-color: #2D3748;
            --white: #FFFFFF;
            --transition: all 0.3s ease;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: linear-gradient(135deg, rgba(26, 54, 93, 0.9) 0%, rgba(45, 55, 72, 0.9) 100%), url('https://images.unsplash.com/photo-1564013799919-ab600027ffc6?ixlib=rb-1.2.1&auto=format&fit=crop&w=1950&q=80');
            background-size: cover;
            background-position: center;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-color);
        }

        /* =========================================
           CONTENEDOR DEL LOGIN (ANIMADO)
        ========================================= */
        .login-container {
            background: var(--white);
            width: 100%;
            max-width: 450px;
            border-radius: 12px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            overflow: hidden;
            transform: translateY(30px);
            opacity: 0;
            animation: slideUp 0.8s forwards;
            margin: 20px;
        }

        @keyframes slideUp {
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .login-header {
            background: var(--primary-color);
            padding: 30px 20px;
            text-align: center;
            color: var(--white);
        }

        .login-header h1 {
            font-size: 28px;
            letter-spacing: 2px;
            margin-bottom: 5px;
        }

        .login-header p {
            font-size: 14px;
            color: #CBD5E0;
        }

        /* =========================================
           PESTAÑAS (VISITANTE / ASESOR)
        ========================================= */
        .tabs {
            display: flex;
            background: #E2E8F0;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 15px 0;
            cursor: pointer;
            font-weight: 600;
            color: #718096;
            transition: var(--transition);
        }

        .tab.active {
            background: var(--white);
            color: var(--primary-color);
            border-bottom: 3px solid var(--secondary-color);
        }

        /* =========================================
           FORMULARIOS
        ========================================= */
        .form-container {
            padding: 30px;
        }

        .form-wrapper {
            display: none;
            animation: fadeIn 0.5s;
        }

        .form-wrapper.active {
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateX(-10px); }
            to { opacity: 1; transform: translateX(0); }
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 600;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            border: 1px solid #CBD5E0;
            border-radius: 6px;
            font-size: 14px;
            transition: var(--transition);
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--secondary-color);
            box-shadow: 0 0 0 3px rgba(214, 158, 46, 0.2);
        }

        .btn-submit {
            width: 100%;
            padding: 14px;
            background: var(--secondary-color);
            color: var(--white);
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: var(--transition);
            margin-top: 10px;
        }

        .btn-submit:hover {
            background: #B7791F;
            transform: translateY(-2px);
        }

        /* Responsivo para móviles */
        @media (max-width: 480px) {
            .login-container {
                margin: 15px;
            }
            .login-header h1 {
                font-size: 24px;
            }
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="login-header">
            <h1>FUENCOR</h1>
            <p>Tu hogar ideal te espera</p>
        </div>

        <div class="tabs">
            <div class="tab active" onclick="switchTab('visitante')">Visitante</div>
            <div class="tab" onclick="switchTab('asesor')">Asesor</div>
        </div>

        <div class="form-container">
            <!-- Formulario de Visitante -->
            <form id="form-visitante" class="form-wrapper active" onsubmit="loginVisitante(event)">
                <div class="input-group">
                    <label for="nombre">Nombre Completo</label>
                    <input type="text" id="nombre" placeholder="Ej. Juan Pérez" required>
                </div>
                <div class="input-group">
                    <label for="correo">Correo Electrónico</label>
                    <input type="email" id="correo" placeholder="tu@correo.com" required>
                </div>
                <div class="input-group">
                    <label for="telefono">Número de Teléfono</label>
                    <input type="tel" id="telefono" placeholder="Ej. 555 123 4567" required>
                </div>
                <button type="submit" class="btn-submit">Ingresar para Comprar</button>
            </form>

            <!-- Formulario de Asesor (Empleados) -->
            <form id="form-asesor" class="form-wrapper" onsubmit="loginAsesor(event)">
                <div class="input-group">
                    <label for="asesor-id">ID de Asesor / Correo</label>
                    <input type="text" id="asesor-id" placeholder="ID de empleado" required>
                </div>
                <div class="input-group">
                    <label for="password">Contraseña</label>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn-submit">Acceso al Panel</button>
            </form>
        </div>
    </div>

    <script>
        // Lógica para cambiar entre las pestañas de Visitante y Asesor
        function switchTab(role) {
            // Actualizar clases de las pestañas
            document.querySelectorAll('.tab').forEach(tab => tab.classList.remove('active'));
            event.target.classList.add('active');

            // Ocultar todos los formularios
            document.querySelectorAll('.form-wrapper').forEach(form => form.classList.remove('active'));

            // Mostrar el formulario correspondiente
            if (role === 'visitante') {
                document.getElementById('form-visitante').classList.add('active');
            } else {
                document.getElementById('form-asesor').classList.add('active');
            }
        }

        // Simulación de ingreso de Visitante
        function loginVisitante(event) {
            event.preventDefault(); // Evita que la página recargue
            
            // Aquí guardaríamos los datos en LocalStorage o Base de Datos para el CRM
            const nombre = document.getElementById('nombre').value;
            localStorage.setItem('usuarioActual', nombre);
            localStorage.setItem('rolActual', 'visitante');
            
            // Animación de salida
            document.querySelector('.login-container').style.transform = 'scale(0.9)';
            document.querySelector('.login-container').style.opacity = '0';
            
            setTimeout(() => {
                // Redirigir a la página de inicio para visitantes
                window.location.href = 'visitantes.html';
            }, 400);
        }

        // Simulación de ingreso de Asesor
        function loginAsesor(event) {
            event.preventDefault();
            
            localStorage.setItem('rolActual', 'asesor');
            
            // Animación de salida
            document.querySelector('.login-container').style.transform = 'scale(0.9)';
            document.querySelector('.login-container').style.opacity = '0';
            
            setTimeout(() => {
                // Redirigir al panel de administración (CRM)
                window.location.href = 'asesor.html';
            }, 400);
        }
    </script>
</body>
</html>
